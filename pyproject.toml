[project]
name = "allstacks-mcp"
version = "0.1.4"
description = "MCP server for Allstacks API - provides AI-ready interface to Allstacks metrics, projects, and analytics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "argparse>=1.4.0,<2.0",
    "httpx>=0.28.1,<1.0",
    "mcp[cli]>=1.7.1,<2.0",
]

[project.scripts]
allstacks-mcp = "allstacks_mcp.server:main"

[tool.mcp]
name = "com.allstacks/allstacks-mcp"
